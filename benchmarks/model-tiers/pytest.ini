[pytest]
testpaths = .
# Offline tests run only when named: `m3 test -- tests_offline` (explicit args bypass this).
norecursedirs = tests_offline .* _control _server _backend _lib results
# The m3 CLI loads its pytest plugin at run time; registering the marker here
# only keeps bare collection free of unknown-mark warnings.
markers =
    m3: M3 suite options (consumed by the m3 CLI's pytest plugin)
