[project]
name = "mcp-pal-app"
version = "0.2.0a3"
description = "Private MCP Pal web application"
requires-python = ">=3.10"
dependencies = [
  "mcp-pal[storage]",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
legacy-ui = [
  "requests>=2.31,<3",
  "streamlit>=1.40,<2",
]

[dependency-groups]
test = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<2",
  "pytest-xdist>=3.6,<4",
]
typecheck = [
  "mypy>=1.11,<2",
]

[tool.uv.sources]
mcp-pal = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../sdk/src"]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider"
markers = ["live: opt-in external network tests", "e2e: end-to-end tests"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_pal_app"]
