[project]
name = "m3-app"
version = "0.2.0a13"
description = "Local web application for viewing M3 test runs"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "m3[storage]",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.4,<3",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
test = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<2",
  "pytest-xdist>=3.6,<4",
]
typecheck = [
  "mypy>=1.11,<2",
]

[tool.mypy]
python_version = "3.10"
strict = true
pretty = true

[tool.uv.sources]
m3 = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "src", "../sdk/src"]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider"
markers = ["live: opt-in external network tests", "e2e: end-to-end tests"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/m3_app"]
