[project]
name = "mcp-pal-cli"
version = "0.2.0a3"
description = "Standalone command line interface for MCP Pal"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "mcp-pal[storage]==0.2.0a3",
  "mcp-pal-app==0.2.0a3",
]

[project.scripts]
mcp-pal = "mcp_pal_cli.main:main"

[tool.uv.sources]
mcp-pal = { workspace = true }
mcp-pal-app = { workspace = true }

[dependency-groups]
test = [
  "pytest>=8,<10",
]
typecheck = [
  "mypy>=1.11,<2",
]

[tool.mypy]
python_version = "3.10"
strict = true
pretty = true

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_pal_cli"]

[tool.hatch.build.targets.sdist]
include = [
  "src/**",
  "tests/**",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]
