[project]
name = "sf-m3-cli"
version = "0.2.0a13"
description = "Standalone command line interface for M3"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "sf-m3[storage]==0.2.0a13",
  "sf-m3-app==0.2.0a13",
]

[project.scripts]
m3 = "m3_cli.main:main"

[tool.uv.sources]
sf-m3 = { workspace = true }
sf-m3-app = { workspace = true }

[dependency-groups]
test = [
  "pytest>=8,<10",
]
typecheck = [
  "mypy>=1.11,<2",
]

[tool.mypy]
python_version = "3.10"
strict = true
pretty = true

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/m3_cli"]

[tool.hatch.build.targets.sdist]
include = [
  "src/**",
  "tests/**",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]
