name: Bug report
description: Something in M3 doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: How to reproduce
      description: The smallest test or command that shows the problem.
      render: python
  - type: input
    attributes:
      label: M3 version
      description: Output of `m3 --version`.
    validations:
      required: true
  - type: input
    attributes:
      label: Harness and model
      description: For example `claude-code` with `claude-sonnet-5-5`. Leave blank if no agent was involved.
  - type: input
    attributes:
      label: OS and Python version
  - type: textarea
    attributes:
      label: Logs or output
      description: Error messages or `m3 doctor` output. Remove any credentials first.
      render: text
