name: Preparation custody

on:
  pull_request:
    paths:
      - 'sdk/src/m3/_process_group_custody.py'
      - 'sdk/src/m3/_preparation_worker.py'
      - 'sdk/src/m3/_preparation_owner.py'
      - 'sdk/src/m3/preparation.py'
      - 'sdk/tests/unit/test_process_group_custody.py'
      - 'sdk/tests/unit/test_preparation.py'
      - '.github/workflows/preparation-custody.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  custody:
    name: Custody (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      TERM: xterm-256color
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.7'
          python-version: ${{ matrix.python }}
      - name: Install locked test dependencies
        run: uv sync --locked --all-packages --extra pytest --extra judge --group test
      - name: Check group ownership and preparation lifecycle
        run: >-
          uv run --locked --no-sync pytest -q
          sdk/tests/unit/test_process_group_custody.py
          sdk/tests/unit/test_preparation.py
