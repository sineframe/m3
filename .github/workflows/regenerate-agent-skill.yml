name: Regenerate agent skill

# Manually regenerate skills/testing-with-m3 from docs/site and open a pull
# request with the result. The selected branch is the base of that pull request.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: regenerate-agent-skill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate skill references
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Render documentation navigation and skill references
        run: |
          set -euo pipefail
          python3 scripts/render_docs_navigation.py
          python3 scripts/render_skill_references.py
      - name: Open pull request with regenerated files
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.ref_name }}
          HEAD_BRANCH: automation/regenerate-agent-skill-${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- skills/testing-with-m3 docs/site/navigation.json)" ]; then
            echo "Agent skill references are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$HEAD_BRANCH"
          git add skills/testing-with-m3 docs/site/navigation.json
          git commit -m "Regenerate agent skill references"
          git push origin "HEAD:$HEAD_BRANCH"
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$HEAD_BRANCH" \
            --title "Regenerate agent skill references" \
            --body "Generated by \`scripts/render_skill_references.py\` from \`docs/site\` on \`$BASE_BRANCH\` (workflow run ${{ github.run_id }}). Pull requests opened with the workflow token do not trigger CI on their own; push a commit or re-run CI from the pull request before merging."
