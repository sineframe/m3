name: Regenerate agent skill

# Manually regenerate every generated documentation artifact that CI source
# checks enforce (Python API reference, navigation, displayed examples and
# skills/testing-with-m3) and open a pull request with the result. The selected
# branch is the base of that pull request.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: regenerate-agent-skill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate skill references
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require a branch
        if: github.ref_type != 'branch'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "Run this workflow on a branch; $REF is not a branch." >&2
          exit 1
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          python-version: "3.13"
          enable-cache: true
      - name: Install locked workspace base dependencies
        run: uv sync --locked --all-packages --no-dev --group lint --group typecheck
      - name: Render generated documentation
        # Order matters: navigation indexes the generated API pages, displayed
        # examples are located through navigation, and skill references copy
        # the fully rendered pages. The API reference imports the SDK, so it
        # runs from the locked environment on the Python version CI checks it with.
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/render_docs_api_reference.py
          python3 scripts/render_docs_navigation.py
          python3 scripts/render_docs_examples.py
          python3 scripts/render_skill_references.py
      - name: Open pull request with regenerated files
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.ref_name }}
          HEAD_BRANCH: automation/regenerate-agent-skill-${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- skills/testing-with-m3 docs/site)" ]; then
            echo "Generated documentation is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$HEAD_BRANCH"
          git add skills/testing-with-m3 docs/site
          git commit -m "Regenerate generated documentation and agent skill references"
          git push origin "HEAD:$HEAD_BRANCH"
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$HEAD_BRANCH" \
            --title "Regenerate generated documentation and agent skill references" \
            --body "Generated by \`scripts/render_docs_api_reference.py\`, \`render_docs_navigation.py\`, \`render_docs_examples.py\` and \`render_skill_references.py\` on \`$BASE_BRANCH\` (workflow run ${{ github.run_id }}). Pull requests opened with the workflow token do not trigger CI on their own; push a commit or re-run CI from the pull request before merging."
