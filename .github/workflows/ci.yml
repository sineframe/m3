name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  OPENROUTER_API_KEY: ""
  OPENCODE_API_KEY: ""

jobs:
  pr-tests:
    name: PR tests (3.10)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          python-version: "3.10"
          enable-cache: true
      - name: Install locked test workspace
        run: >-
          uv sync --locked --all-packages
          --extra pytest --extra judge --extra storage --extra property
          --group test --group typecheck
      - name: Install Node for installed-Pi tests
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24
      - name: Install verified Pi version
        run: npm install --global @earendil-works/pi-coding-agent@0.85.1
      - name: Run SDK tests without live providers
        run: |
          uv run --locked --no-sync --project sdk --extra judge \
            pytest -q -n 2 --dist worksteal -m "not live and not process_lifecycle" \
            sdk/tests/unit
          M3_REQUIRE_PI_MRTR=1 uv run --locked --no-sync --project sdk --extra judge \
            pytest -q \
            sdk/tests/integration/test_direct_client_mrtr.py \
            sdk/tests/integration/test_examples_contract.py \
            sdk/tests/e2e/test_real_pi_mrtr_gate.py \
            sdk/examples/tests/test_modern_mrtr_sdk.py \
            sdk/examples/tests/test_modern_mrtr_direct.py \
            sdk/examples/tests/test_modern_mrtr_pi_qualified.py \
            sdk/examples/tests/test_modern_mrtr_pi_unqualified.py \
            sdk/examples/tests/test_modern_mrtr_pi_session.py \
            sdk/examples/tests/test_modern_mrtr_pi_composed.py
      - name: Run application unit tests without live providers
        run: >-
          uv run --locked --no-sync --project app
          pytest -q -n 2 --dist worksteal -m "not live" app/tests/unit
      - name: Run CLI smoke tests
        run: >-
          uv run --locked --no-sync --project cli pytest -q
          cli/tests/test_init.py cli/tests/test_setup.py
          cli/tests/test_doctor.py cli/tests/test_web.py

  main-sdk-tests:
    name: Main SDK tests (3.10)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          python-version: "3.10"
          enable-cache: true
      - name: Install locked test workspace
        run: >-
          uv sync --locked --all-packages
          --extra pytest --extra judge --extra storage --extra property
          --group test --group typecheck
      - name: Run SDK tests without live providers or process lifecycle
        run: >-
          uv run --locked --no-sync --project sdk --extra judge
          pytest -q -n 2 --dist worksteal -m "not live and not process_lifecycle"
          sdk/tests

  main-sdk-lifecycle:
    name: Main SDK processes (3.10)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          python-version: "3.10"
          enable-cache: true
      - name: Install locked test workspace
        run: >-
          uv sync --locked --all-packages
          --extra pytest --extra judge --extra storage --extra property
          --group test --group typecheck
      - name: Install Node for installed-Pi tests
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24
      - name: Install verified Pi version
        run: npm install --global @earendil-works/pi-coding-agent@0.85.1
      - name: Run process lifecycle tests serially
        env:
          M3_REQUIRE_PI_MRTR: "1"
        run: >-
          uv run --locked --no-sync --project sdk --extra judge
          pytest -q -m "not live and process_lifecycle" sdk/tests

  main-sdk-examples:
    name: Main SDK examples (3.10)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          python-version: "3.10"
          enable-cache: true
      - name: Install locked test workspace
        run: >-
          uv sync --locked --all-packages
          --extra pytest --extra judge --extra storage --extra property
          --group test --group typecheck
      - name: Install Node for installed-Pi examples
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24
      - name: Install verified Pi version
        run: npm install --global @earendil-works/pi-coding-agent@0.85.1
      - name: Run SDK examples without live providers
        env:
          M3_REQUIRE_PI_MRTR: "1"
        run: >-
          uv run --locked --no-sync --project sdk --extra judge
          pytest -q -n 2 --dist worksteal -m "not live" sdk/examples/tests

  main-app-tests:
    name: Main app tests (3.10)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          python-version: "3.10"
          enable-cache: true
      - name: Install locked test workspace
        run: >-
          uv sync --locked --all-packages
          --extra pytest --extra judge --extra storage --extra property
          --group test --group typecheck
      - name: Run application tests without live providers
        run: >-
          uv run --locked --no-sync --project app
          pytest -q -n 2 --dist worksteal -m "not live" app/tests

  main-cli-tests:
    name: Main CLI tests (3.10)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          python-version: "3.10"
          enable-cache: true
      - name: Install locked test workspace
        run: >-
          uv sync --locked --all-packages
          --extra pytest --extra judge --extra storage --extra property
          --group test --group typecheck
      - name: Run complete CLI suite
        run: uv run --locked --no-sync --project cli pytest -q cli/tests

  main-python-compatibility:
    name: Main compatibility (3.13)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          python-version: "3.13"
          enable-cache: true
      - name: Install locked test workspace
        run: >-
          uv sync --locked --all-packages
          --extra pytest --extra judge --extra storage --extra property
          --group test --group typecheck
      - name: Run SDK unit tests without live providers or process lifecycle
        run: >-
          uv run --locked --no-sync --project sdk --extra judge
          pytest -vv -x -n 2 --dist worksteal --timeout=90 --timeout-method=signal
          -m "not live and not process_lifecycle"
          sdk/tests/unit
      - name: Run application unit tests without live providers
        run: >-
          uv run --locked --no-sync --project app
          pytest -q -n 2 --dist worksteal -m "not live" app/tests/unit
      - name: Run CLI smoke tests
        run: >-
          uv run --locked --no-sync --project cli pytest -q
          cli/tests/test_init.py cli/tests/test_setup.py
          cli/tests/test_doctor.py cli/tests/test_web.py

  quality:
    name: Source checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          python-version: "3.13"
          enable-cache: true

      - name: Install locked workspace base dependencies
        run: uv sync --locked --all-packages --no-dev --group lint --group typecheck

      - name: Verify lockfile
        run: uv lock --check

      - name: Lint Python sources
        run: uv run --locked --no-sync --group lint ruff check .

      - name: Check Python formatting
        run: uv run --locked --group lint ruff format --check .

      - name: Type-check SDK public ratchet
        run: uv run --isolated --python 3.10 --locked --project sdk --extra judge --group typecheck mypy --config-file sdk/pyproject.toml --strict sdk/src/m3/types.py sdk/src/m3/errors.py sdk/src/m3/policy.py sdk/src/m3/interaction_handlers.py sdk/src/m3/configuration.py

      - name: Type-check SDK
        run: uv run --isolated --python 3.10 --locked --project sdk --extra judge --group typecheck mypy --config-file sdk/pyproject.toml --strict sdk/src/m3

      - name: Type-check application
        run: uv run --isolated --python 3.10 --locked --project app --group typecheck mypy --config-file app/pyproject.toml --strict app/src/m3_app

      - name: Type-check CLI
        run: uv run --isolated --python 3.10 --locked --project cli --group typecheck mypy --config-file cli/pyproject.toml --strict cli/src/m3_cli

      - name: Compile SDK
        run: uv run --locked --no-sync --project sdk python -m compileall -q sdk/src

      - name: Compile application
        run: uv run --locked --no-sync --project app python -m compileall -q app/src

      - name: Import application
        run: uv run --locked --no-sync --project app python -c "from m3_app.main import app; print(app.title)"

      - name: Import SDK judge without optional dependencies
        run: >-
          uv run --isolated --no-project
          --with "sf-m3 @ file://${GITHUB_WORKSPACE}/sdk"
          python -c "import importlib.util; from m3.judges import LLMJudge; assert importlib.util.find_spec('openai') is None; print(LLMJudge.__name__)"

      - name: Compile CLI
        run: uv run --locked --no-sync --project cli python -m compileall -q cli/src

      - name: Import CLI
        run: uv run --locked --no-sync --project cli python -c "import m3_cli; print(m3_cli.__name__)"

      - name: Run live local-ASGI security gate
        run: >-
          uv run --isolated --python 3.10 --locked --project cli --group test
          pytest -q -c cli/pyproject.toml cli/tests/test_web_security_live.py

      - name: Check shell installer syntax
        run: sh -n scripts/install.sh.in scripts/install-latest.sh

      - name: Build application distributions
        if: github.event_name == 'push'
        run: uv build --project app

      - name: Build and smoke-test SDK distributions
        if: github.event_name == 'push'
        run: uv run --locked --no-sync --project sdk python scripts/check_packaging.py

  public-packaging:
    name: Main installer smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          python-version: "3.13"
      - name: Install public test workspace
        run: >-
          uv sync --locked --all-packages
          --extra pytest --extra judge --extra storage --extra property
          --group test --group typecheck
      - name: Check POSIX scripts
        run: sh -n scripts/install.sh.in scripts/install-latest.sh
      - name: Build fixture UI wheels
        run: |
          release_dir="$RUNNER_TEMP/m3-fixture-release"
          mkdir -p "$release_dir"
          python scripts/build_cli_release.py --ui-dist cli/tests/fixtures/ui --out-dir "$release_dir"
      - name: Install from staged release assets
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/m3-fixture-release"
          version=$(python scripts/build_cli_release.py --print-version)
          python scripts/render_cli_installers.py --version "$version" --output-dir "$release_dir"
          (cd "$release_dir" && sha256sum \
            "sf_m3-${version}-py3-none-any.whl" \
            "sf_m3_app-${version}-py3-none-any.whl" \
            "sf_m3_cli-${version}-py3-none-any.whl" \
            | sort -k2 > SHA256SUMS)
          M3_RELEASE_BASE_URL="file://$release_dir" \
            UV_TOOL_DIR="$RUNNER_TEMP/m3-fixture-tools" \
            UV_TOOL_BIN_DIR="$RUNNER_TEMP/m3-fixture-bin" \
            sh "$release_dir/install.sh"
      - name: Check dependency metadata and local installer behavior
        run: |
          version=$(python scripts/build_cli_release.py --print-version)
          python scripts/check_cli_standalone.py --release-dir "$RUNNER_TEMP/m3-fixture-release" --version "$version"

  cli-standalone:
    name: Main UI package
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the pinned UI commit
        id: ui-ref
        shell: bash
        env:
          UI_REPOSITORY_TOKEN: ${{ secrets.MCPPAL_UI_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$UI_REPOSITORY_TOKEN" ]]; then
            echo 'MCPPAL_UI_TOKEN must be configured with read access to the private m3-ui repository' >&2
            exit 1
          fi
          ui_ref=$(tr -d '\r\n' < cli/UI_REF)
          if [[ ! "$ui_ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'cli/UI_REF must contain exactly 40 lowercase hexadecimal characters' >&2
            exit 1
          fi
          printf 'sha=%s\n' "$ui_ref" >> "$GITHUB_OUTPUT"

      - name: Check out the pinned UI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rishhavv/m3-ui
          ref: ${{ steps.ui-ref.outputs.sha }}
          path: .release-ui
          token: ${{ secrets.MCPPAL_UI_TOKEN }}
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          python-version: "3.13"
          enable-cache: true

      - name: Install Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .release-ui/package-lock.json

      - name: Build production UI
        working-directory: .release-ui
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium

      - name: Build the three production wheels
        id: release
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/sf-m3-cli-release"
          mkdir -p "$release_dir"
          version=$(python scripts/build_cli_release.py --print-version)
          python scripts/build_cli_release.py \
            --ui-dist .release-ui/dist \
            --out-dir "$release_dir" \
            --expected-version "$version"
          python scripts/render_cli_installers.py --version "$version" --output-dir "$release_dir"
          wheels=(
            "sf_m3-${version}-py3-none-any.whl"
            "sf_m3_app-${version}-py3-none-any.whl"
            "sf_m3_cli-${version}-py3-none-any.whl"
          )
          (cd "$release_dir" && sha256sum "${wheels[@]}" | sort -k2 > SHA256SUMS)
          test "$(wc -l < "$release_dir/SHA256SUMS")" -eq 3
          printf 'dir=%s\nversion=%s\n' "$release_dir" "$version" >> "$GITHUB_OUTPUT"

      - name: Smoke-test uv tool installation
        run: |
          python scripts/smoke_cli_uv_install.py \
            --release-dir '${{ steps.release.outputs.dir }}' \
            --version '${{ steps.release.outputs.version }}'

      - name: Run the isolated two-environment standalone gate
        run: |
          python scripts/check_cli_standalone.py \
            --release-dir '${{ steps.release.outputs.dir }}' \
            --version '${{ steps.release.outputs.version }}' \
            --ui-dir .release-ui

  managed-runtime-assets:
    if: github.event_name == 'workflow_dispatch'
    name: Manual managed assets
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, kind: opencode }
          - { os: macos-latest, kind: opencode }
          - { os: windows-latest, kind: opencode }
          - { os: macos-latest, kind: claude }
          - { os: windows-latest, kind: codex }
          - { os: macos-latest, kind: pi }
          - { os: windows-latest, kind: pi }

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          python-version: "3.13"
          enable-cache: true

      - name: Install locked SDK test dependencies
        run: uv sync --locked --project sdk --extra pytest

      - name: Download, verify, launch, and reuse the managed CLI
        env:
          M3_RUN_LIVE_MANAGED_ASSETS: "1"
          M3_LIVE_MANAGED_KIND: ${{ matrix.kind }}
          M3_GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run --locked --no-sync --project sdk pytest -q
          sdk/tests/e2e/test_live_managed_asset_download.py
