[project]
name = "sf-m3"
version = "0.2.0a13"
description = "Python SDK for testing MCP servers and agent harnesses"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "M3 contributors" }]
keywords = ["mcp", "model-context-protocol", "testing", "pytest", "agents"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "agent-client-protocol==0.12.1",
  "anyio>=4.5,<5",
  "httpcore>=1,<2",
  "httpcore2>=2.5,<3",
  "httpx>=0.27,<1",
  "httpx2>=2.5,<3",
  "idna>=3,<4",
  "jsonschema>=4.20,<5",
  "mcp>=2.0.0,<3",
  "pydantic>=2.8,<3",
  "python-dotenv>=1,<2",
  "starlette>=0.40,<2",
  "tomli>=2,<3; python_version < '3.11'",
  "uvicorn[standard]>=0.30,<1",
]

[project.urls]
Homepage = "https://github.com/sineframe/m3"
Repository = "https://github.com/sineframe/m3"
Issues = "https://github.com/sineframe/m3/issues"

[project.optional-dependencies]
pytest = [
  "cryptography>=43,<51",
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<2",
  "pytest-xdist>=3.6,<4",
]
storage = [
  "sqlalchemy>=2.0,<3",
]
property = [
  "hypothesis>=6.100,<7",
]
judge = [
  "openai>=3.16,<4",
]
docs = [
  "mkdocs-material>=9.5,<10",
  "mkdocstrings[python]>=0.25,<2",
]
all = [
  "cryptography>=43,<51",
  "httpx>=0.27,<1",
  "hypothesis>=6.100,<7",
  "mkdocs-material>=9.5,<10",
  "mkdocstrings[python]>=0.25,<2",
  "openai>=3.16,<4",
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<2",
  "sqlalchemy>=2.0,<3",
]

[dependency-groups]
typecheck = [
  "hypothesis>=6.100,<7",
  "mypy>=1.11,<2",
  "pytest>=8,<10",
  "sqlalchemy>=2.0,<3",
  "tomli>=2,<3",
]

[tool.mypy]
python_version = "3.10"
strict = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider"
markers = [
  "e2e: black-box SDK workflows that cross real process or persistence boundaries",
  "live: opt-in tests that call a live external provider and may incur cost",
  "process_lifecycle: tests that launch or assert cleanup of real subprocesses; run serially in CI",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/m3"]

[tool.hatch.build.targets.wheel.force-include]
"src/m3/py.typed" = "m3/py.typed"
"src/m3/harness/pi_extension/extension.ts" = "m3/harness/pi_extension/extension.ts"

[tool.hatch.build.targets.sdist]
include = [
  "src/**",
  "tests/**",
  "examples/**",
  "docs/**",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]
