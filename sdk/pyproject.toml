[project]
name = "mcp-pal"
version = "0.2.0a3"
description = "Python SDK for testing MCP servers and agent harnesses"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "MCP Pal contributors" }]
keywords = ["mcp", "model-context-protocol", "testing", "pytest", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "agent-client-protocol==0.12.1",
  "httpx>=0.27,<1",
  "httpx2>=2.5,<3",
  "jsonschema>=4.20,<5",
  "mcp>=2,<3",
  "pydantic>=2.8,<3",
  "python-dotenv>=1,<2",
  "starlette>=0.40,<2",
  "tomli>=2,<3; python_version < '3.11'",
  "uvicorn[standard]>=0.30,<1",
]

[project.urls]
Homepage = "https://github.com/mcppal/mcp-pal"
Repository = "https://github.com/mcppal/mcp-pal"
Issues = "https://github.com/mcppal/mcp-pal/issues"

[project.optional-dependencies]
pytest = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<2",
]
storage = [
  "sqlalchemy>=2.0,<3",
]
property = [
  "hypothesis>=6.100,<7",
]
docs = [
  "mkdocs-material>=9.5,<10",
  "mkdocstrings[python]>=0.25,<2",
]
all = [
  "httpx>=0.27,<1",
  "hypothesis>=6.100,<7",
  "mkdocs-material>=9.5,<10",
  "mkdocstrings[python]>=0.25,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<2",
  "sqlalchemy>=2.0,<3",
]

[project.scripts]
mcp-pal-harness = "mcp_pal.harness.cli:main"
mcp-pal-reference-bridge = "mcp_pal.bridge.reference:main"

[dependency-groups]
typecheck = [
  "mypy>=1.11,<2",
]

[tool.mypy]
python_version = "3.10"
strict = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider"
markers = [
  "e2e: black-box SDK workflows that cross real process or persistence boundaries",
  "live: opt-in tests that call a live external provider and may incur cost",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_pal"]

[tool.hatch.build.targets.wheel.force-include]
"src/mcp_pal/py.typed" = "mcp_pal/py.typed"

[tool.hatch.build.targets.sdist]
include = [
  "src/**",
  "tests/**",
  "examples/**",
  "docs/**",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]
