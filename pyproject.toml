[tool.uv.workspace]
members = ["sdk", "app", "cli"]

[dependency-groups]
lint = [
  "ruff>=0.16,<1",
]

[tool.ruff]
target-version = "py310"
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
# Keep correctness and safe modernization enabled as the repository grows.
# E501 remains intentionally disabled: Ruff's formatter handles ordinary line
# wrapping, while long literals and generated protocol payloads are clearer as
# written.
select = ["F", "I", "B", "RUF", "UP", "E701", "E702"]

[tool.ruff.lint.isort]
known-first-party = ["mcp_pal", "mcp_pal_app", "mcp_pal_cli"]

[tool.pytest.ini_options]
testpaths = ["sdk/tests", "app/tests", "cli/tests"]
pythonpath = ["sdk/src", "app/src", "cli/src"]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider"
markers = [
  "e2e: black-box SDK workflows that cross real process or persistence boundaries",
  "live: opt-in tests that call a live external provider and may incur cost",
  "process_lifecycle: tests that launch or assert cleanup of real subprocesses; run serially in CI",
]
